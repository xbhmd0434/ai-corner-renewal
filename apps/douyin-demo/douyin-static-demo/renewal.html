<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 一角焕新</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./renewal/styles/renewal.css" />
  </head>
  <body>
    <main class="renewal-stage">
      <aside class="renewal-intro" aria-label="项目介绍">
        <span class="renewal-intro__eyebrow">DOUYIN × HOME × AI</span>
        <h1>把刷到的喜欢，<br /><em>搬进我家。</em></h1>
        <p>从一帧生活灵感，到适合真实空间、预算和生活限制的可执行方案。</p>
        <div class="renewal-intro__flow" aria-label="体验流程">
          <span>01 灵感</span>
          <i></i>
          <span>02 空间</span>
          <i></i>
          <span>03 落地</span>
        </div>
        <small>一角焕新 · Demo 0.5.2</small>
      </aside>

      <section class="phone renewal-phone" aria-label="AI 一角焕新手机演示">
        <div class="renewal-app" id="renewalApp">
          <div class="renewal-device-status" aria-hidden="true">
            <time id="deviceTime">09:41</time>
            <span>
              <svg viewBox="0 0 24 12"><path d="M1 10h2V8H1v2Zm4 0h2V6H5v4Zm4 0h2V4H9v6Zm4 0h2V2h-2v8Z"/></svg>
              <svg viewBox="0 0 18 12"><path d="M1 4.5C5.5.5 12.5.5 17 4.5M4 7c3-2.5 7-2.5 10 0M7.5 9.5c1.5-1 3.5-1 5 0"/></svg>
              <svg viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="2"/><path d="M24 4v4"/><rect x="3" y="3" width="16" height="6" rx="1"/></svg>
            </span>
          </div>

          <header class="renewal-header">
            <button class="renewal-icon-button" type="button" id="renewalBack" aria-label="返回视频流">
              <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="renewal-header__title">
              <small>AI HOME EDIT</small>
              <strong>一角焕新</strong>
            </div>
            <button class="backend-status is-offline" type="button" id="backendStatus" aria-label="检查后端连接">
              <i></i><span>离线</span>
            </button>
          </header>

          <div class="renewal-content" id="renewalContent">
            <article class="renewal-core" id="coreCard" data-core-state="IDLE">
              <div class="renewal-core__lead">
                <span>ONE CORNER, ONE NEW LIFE</span>
                <h2 id="coreHeading">把这盏灯，搬进这张桌面。</h2>
                <p id="coreSubheading">先看清“搬什么”和“搬到哪里”，再交给 AI。</p>
              </div>

              <section class="core-section" id="inspirationBar" aria-label="要搬进来的组件"></section>
              <section class="core-section" id="intentPanel" aria-label="组件锁定规则" hidden></section>
              <section class="core-section" id="spacePicker" aria-label="要改造的真实空间"></section>
              <section class="core-section render-preview" id="renderPreview" aria-label="AI 操作说明" hidden></section>
              <section class="core-section" id="constraintBar" aria-label="焕新要求"></section>
              <section class="core-section" id="generateArea" aria-label="生成方案"></section>
              <section class="core-section" id="progressArea" aria-label="生成进度" hidden></section>
              <section class="core-section result-area" id="resultArea" aria-label="焕新结果" hidden></section>
              <section class="core-section" id="resultWorkflowArea" aria-label="保存、发布与实施" hidden></section>
              <section class="core-section" id="relatedDesignArea" aria-label="相关设计" hidden></section>
            </article>
          </div>

          <footer class="renewal-bottom-bar">
            <button type="button" id="openAssetDrawer">
              <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
              <span><small>COLLECTION</small>我的收藏</span>
            </button>
            <i></i>
            <button type="button" id="openHistoryDrawer">
              <svg viewBox="0 0 24 24"><path d="M4 5h16v15H4z"/><path d="M8 2v6M16 2v6M8 12h8M8 16h5"/></svg>
              <span><small>HISTORY</small>历史方案</span>
            </button>
          </footer>

          <input id="spaceFileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden />
          <input id="spaceCameraInput" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden />

          <div class="renewal-drawer" id="assetDrawer" aria-hidden="true">
            <div class="renewal-drawer__scrim" data-close-drawer></div>
            <section class="renewal-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="assetDrawerTitle">
              <div class="renewal-drawer__grip"></div>
              <header>
                <div><small>MY COLLECTION</small><h2 id="assetDrawerTitle">我的收藏</h2></div>
                <button class="renewal-icon-button" type="button" data-close-drawer aria-label="关闭收藏抽屉">
                  <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
              </header>
              <div id="assetDrawerContent"></div>
            </section>
          </div>

          <div class="renewal-drawer" id="historyDrawer" aria-hidden="true">
            <div class="renewal-drawer__scrim" data-close-drawer></div>
            <section class="renewal-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="historyDrawerTitle">
              <div class="renewal-drawer__grip"></div>
              <header>
                <div><small>SAVED PLANS</small><h2 id="historyDrawerTitle">历史方案</h2></div>
                <button class="renewal-icon-button" type="button" data-close-drawer aria-label="关闭历史方案抽屉">
                  <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
              </header>
              <div id="historyDrawerContent"></div>
            </section>
          </div>

          <div class="renewal-dialog-layer" id="renewalDialogLayer" aria-hidden="true"></div>
          <div class="renewal-toast" id="renewalToast" role="status" aria-live="polite"></div>
          <div class="renewal-loading" id="renewalLoading" aria-hidden="true">
            <div class="renewal-loading__mark"><i></i><i></i><i></i></div>
            <span>正在整理这一角…</span>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./renewal/main.js"></script>
  </body>
</html>
