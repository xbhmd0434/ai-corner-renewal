<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <title>3D 挂件试搭 · 抖音 Demo</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./try-on.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="home-shell">
      <section class="phone tryon-phone" aria-label="3D 挂件试搭">
        <div class="tryon-app">
          <header class="tryon-header">
            <button class="tryon-header__back" id="tryonBack" type="button" aria-label="返回">‹</button>
            <div class="tryon-header__title">
              <strong>3D 挂件试搭</strong>
              <small>两个独立模型 · 实时预览</small>
            </div>
            <span class="tryon-runtime" id="tryonRuntime"><i></i>加载中</span>
          </header>

          <section class="tryon-stage" id="tryonStage">
            <canvas id="tryonCanvas" aria-label="包与挂件 3D 试搭画布"></canvas>

            <div class="tryon-source" id="tryonSource">
              <span>来自我的橱窗</span>
              <strong>小蓝鲸 × 云朵包</strong>
            </div>

            <div class="tryon-live-proof">
              <b>LIVE 3D</b>
              <span id="modelSource">正在载入本机模型</span>
            </div>

            <div class="tryon-views" id="tryonViews" aria-label="视角切换"></div>

            <div class="tryon-drag-hint" id="dragHint">
              <i>↖</i> 拖动挂件调整位置
            </div>
          </section>

          <section class="tryon-sheet">
            <div class="tryon-sheet__grip"></div>
            <div class="tryon-selection">
              <div>
                <small>正在试搭</small>
                <strong><span id="activeBagName">云朵腋下包</span> ＋ <em id="activeCharmName">小蓝鲸</em></strong>
              </div>
              <span class="tryon-unsaved" id="tryonSaveState"><i></i>未保存</span>
            </div>

            <div class="tryon-scroll">
              <section class="tryon-control">
                <div class="tryon-control__title">
                  <strong>我的包</strong>
                  <label>载入 GLB<input id="bagGlbInput" type="file" accept=".glb,model/gltf-binary" /></label>
                </div>
                <div class="tryon-asset-row" id="bagAssets"></div>
              </section>

              <section class="tryon-control">
                <div class="tryon-control__title">
                  <strong>喜欢的挂件</strong>
                  <label>载入 GLB<input id="charmGlbInput" type="file" accept=".glb,model/gltf-binary" /></label>
                </div>
                <div class="tryon-asset-row tryon-asset-row--charms" id="charmAssets"></div>
              </section>

              <section class="tryon-control">
                <div class="tryon-control__title">
                  <strong>推荐挂点</strong>
                  <small>先吸附，再微调</small>
                </div>
                <div class="tryon-anchor-row" id="tryonAnchors"></div>
              </section>

              <section class="tryon-control tryon-adjust">
                <label>
                  <span>左右 <b id="positionXValue">+0.90</b></span>
                  <input id="positionX" type="range" min="-1.3" max="1.3" step="0.01" value="0.9" />
                </label>
                <label>
                  <span>上下 <b id="positionYValue">+0.28</b></span>
                  <input id="positionY" type="range" min="-0.65" max="1.1" step="0.01" value="0.28" />
                </label>
              </section>

              <section class="tryon-control tryon-steppers">
                <div>
                  <small>角度</small>
                  <div class="tryon-stepper">
                    <button id="rotateLeft" type="button">−</button>
                    <strong id="rotationValue">−7°</strong>
                    <button id="rotateRight" type="button">＋</button>
                  </div>
                </div>
                <div>
                  <small>大小</small>
                  <div class="tryon-stepper">
                    <button id="scaleDown" type="button">−</button>
                    <strong id="scaleValue">100%</strong>
                    <button id="scaleUp" type="button">＋</button>
                  </div>
                </div>
              </section>

              <aside class="tryon-fit-note">
                <span>视觉试搭</span>
                <p id="fitMessage">挂点关系清楚，当前比例适中。真实尺寸和承重请在购买前复核。</p>
              </aside>
            </div>

            <footer class="tryon-actions">
              <button class="tryon-action tryon-action--quiet" id="restoreTryon" type="button">恢复</button>
              <button class="tryon-action tryon-action--quiet" id="exportTryon" type="button">导出</button>
              <button class="tryon-action tryon-action--primary" id="saveTryon" type="button">保存到橱窗</button>
            </footer>
          </section>

          <div class="tryon-toast" id="tryonToast" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./try-on/main.js"></script>
  </body>
</html>
