name: Bug
description: 报告可复现的功能或演示问题
title: "[Bug] "
labels: ["type/bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Chrome 版本 / Commit SHA
  - type: checkboxes
    id: safety
    attributes:
      label: 数据检查
      options:
        - label: 截图和日志不包含访问密钥或真实用户数据
          required: true
