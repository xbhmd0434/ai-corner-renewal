name: Validate

on:
  push:
    branches: ["main", "agent/**", "feature/**", "fix/**", "docs/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate repository
        run: npm run check
