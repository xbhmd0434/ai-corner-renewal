          "code",
          "message",
          "blocking"
        ],
        "properties": {
          "path": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "blocking": {
            "type": "boolean"
          }
        }
      },
