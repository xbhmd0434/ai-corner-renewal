      "get": {
        "operationId": "listAssets",
        "tags": [
          "Assets"
        ],
        "summary": "筛选和分页读取资产",
        "parameters": [
          {
            "name": "asset_type",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "space",
                "inspiration",
                "item"
              ]
            },
            "description": "资产类型"
          },
          {
            "name": "lifecycle",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "temporary",
                "saved",
                "archived"
              ]
            },
            "description": "生命周期"
          },
          {
            "name": "parse_state",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "queued",
                "parsing",
                "needs_confirmation",
                "ready",
                "failed"
              ]
            },
            "description": "解析状态"
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "recent",
                "match"
              ]
            },
            "description": "排序方式"
          },
          {
            "name": "compatible_with_asset_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "返回与指定资产兼容的候选并附匹配理由"
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "不透明分页游标"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            },
            "description": "分页大小"
          }
        ],
