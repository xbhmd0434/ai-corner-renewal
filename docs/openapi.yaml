              "expires_at": {
                "$ref": "#/components/schemas/Timestamp"
              }
            }
          },
          "created_at": {
            "$ref": "#/components/schemas/Timestamp"
          }
        }
      },
      "Asset": {
        "type": "object",
        "required": [
          "schema_version",
          "asset_id",
          "asset_type",
          "lifecycle",
          "parse_state",
          "name",
          "tags",
          "is_default",
          "resource_version",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "schema_version": {
            "$ref": "#/components/schemas/SchemaVersion"
          },
          "asset_id": {
            "$ref": "#/components/schemas/Identifier"
