            "oneOf": [
              {
                "$ref": "#/components/schemas/Identifier"
              },
              {
                "type": "null"
              }
            ]
          },
          "state": {
            "enum": [
              "draft",
              "sealed"
            ]
          },
          "resource_version": {
            "type": "integer",
            "minimum": 1
          },
          "parse_state": {
            "enum": [
              "queued",
              "parsing",
              "needs_confirmation",
              "ready",
              "failed"
            ]
          },
          "media_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/Identifier"
            }
          },
          "reference_width_cm": {
            "oneOf": [
              {
                "type": "integer",
                "minimum": 40,
                "maximum": 400
              },
              {
                "type": "null"
              }
            ]
          },
          "attributes": {
            "type": "object"
          },
          "created_at": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "updated_at": {
            "$ref": "#/components/schemas/Timestamp"
          }
        }
      },
